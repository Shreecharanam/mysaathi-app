name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up fixed signing key
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/upload.p12
          keytool -importkeystore -srckeystore /tmp/upload.p12 -srcstoretype PKCS12 -srcstorepass "${{ secrets.KEYSTORE_PASSWORD }}" -srcalias "${{ secrets.KEY_ALIAS }}" -destkeystore "$HOME/.android/debug.keystore" -deststoretype JKS -deststorepass android -destkeypass android -destalias androiddebugkey -noprompt
          rm -f /tmp/upload.p12
          echo "Signing key ready:"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | grep -E "Alias name|SHA1:|SHA256:" || true

      - name: Generate Android platform files
        run: |
          flutter create --org com.mysaathi --project-name mysaathi --platforms=android /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Apply Android launch bridge
        run: |
          DEST=$(find android/app/src/main -name "MainActivity.kt" | head -1)
          if [ -z "$DEST" ]; then
            DEST="android/app/src/main/kotlin/com/mysaathi/mysaathi/MainActivity.kt"
          fi
          mkdir -p "$(dirname "$DEST")"
          cp android_patch/MainActivity.kt "$DEST"
          echo "Wrote $DEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mysaathi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
