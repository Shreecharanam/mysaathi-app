name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare signing key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/mysaathi.p12"
          echo "KS_FILE=$RUNNER_TEMP/mysaathi.p12" >> "$GITHUB_ENV"
          echo "KS_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KS_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "Signing key ready:"
          keytool -list -v -keystore "$RUNNER_TEMP/mysaathi.p12" -storetype PKCS12 -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep -E "Alias name|SHA1:|SHA256:" || true

      - name: Generate Android platform files
        run: |
          flutter create --org com.mysaathi --project-name mysaathi --platforms=android /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Add Firebase config and patch gradle
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > android/app/google-services.json
          echo "wrote android/app/google-services.json"
          python3 tools/patch_firebase.py

      - name: Apply Android launch bridge
        run: |
          DEST=$(find android/app/src/main -name "MainActivity.kt" | head -1)
          if [ -z "$DEST" ]; then
            DEST="android/app/src/main/kotlin/com/mysaathi/mysaathi/MainActivity.kt"
          fi
          mkdir -p "$(dirname "$DEST")"
          cp android_patch/MainActivity.kt "$DEST"
          echo "Wrote $DEST"

      - name: Patch release signing config
        run: python3 tools/patch_signing.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk || true
          echo "Expected our key SHA-256: F6:26:AD:5F:A2:62:32:BD:B7:BA:7B:78:D8:28:79:AC:18:87:FB:03:F0:36:33:64:A1:99:C7:69:F2:AF:73:35"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mysaathi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
