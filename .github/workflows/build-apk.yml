name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --org com.mysaathi --project-name mysaathi --platforms=android /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Apply Android launch bridge
        run: |
          echo "MainActivity files found:"
          find android/app/src/main -name "MainActivity.*" || true
          DEST=$(find android/app/src/main -name "MainActivity.kt" | head -1)
          if [ -z "$DEST" ]; then
            DEST="android/app/src/main/kotlin/com/mysaathi/mysaathi/MainActivity.kt"
          fi
          mkdir -p "$(dirname "$DEST")"
          cp android_patch/MainActivity.kt "$DEST"
          echo "Wrote $DEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mysaathi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
